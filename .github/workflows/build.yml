name: Build AMXX Plugin

env:
  PLUGIN_NAME: webhook_reporter
  AMXX_VERSION: 1.10.0-git5481
  AMXX_LINUX_SHA256: ee33b31ae92afd94802c43eae14ecdfa1ffa2ba0b11658e8bec98f48a5881272
  AMXX_WINDOWS_SHA256: 5ece16f1c0060de0591cdc7ea3643c71598b3754938c7d39e3b7923dafbc57af

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install AMX Mod X compiler 1.10 (Linux)
        run: |
          wget -q "https://github.com/alliedmodders/amxmodx/releases/download/${AMXX_VERSION}/amxmodx-${AMXX_VERSION}-base-linux.tar.gz" -O amxmodx.tar.gz
          echo "${AMXX_LINUX_SHA256}  amxmodx.tar.gz" | sha256sum -c -
          mkdir -p amxmodx_linux
          tar -xzf amxmodx.tar.gz -C amxmodx_linux
          AMXXPC=$(find amxmodx_linux -name "amxxpc" -type f | head -n1)
          AMXXPC_DIR=$(dirname "$AMXXPC")
          echo "AMXXPC=$AMXXPC" >> "$GITHUB_ENV"
          echo "AMXXPC_DIR=$AMXXPC_DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$AMXXPC_DIR:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          chmod +x "$AMXXPC"

      - name: Compile ${{ env.PLUGIN_NAME }}.sma
        run: |
          mkdir -p amxmodx/scripting/compiled
          # EasyHttp includes are vendored in amxmodx/scripting/include.
          LD_LIBRARY_PATH="$AMXXPC_DIR:${LD_LIBRARY_PATH}" \
            "$AMXXPC" "amxmodx/scripting/${PLUGIN_NAME}.sma" \
            "-oamxmodx/scripting/compiled/${PLUGIN_NAME}.amxx" \
            "-iamxmodx/scripting/include" \
            "-iamxmodx_linux/addons/amxmodx/scripting/include"
          test -f "amxmodx/scripting/compiled/${PLUGIN_NAME}.amxx" || { echo "Compile failed - artifact missing" >&2; exit 1; }

      - name: Upload plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PLUGIN_NAME }}.amxx
          path: amxmodx/scripting/compiled/${{ env.PLUGIN_NAME }}.amxx
          if-no-files-found: error

  build_windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install AMX Mod X compiler 1.10 (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/alliedmodders/amxmodx/releases/download/$env:AMXX_VERSION/amxmodx-$env:AMXX_VERSION-base-windows.zip" -OutFile amxmodx.zip
          $hash = (Get-FileHash amxmodx.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:AMXX_WINDOWS_SHA256) { throw "AMX Mod X archive checksum mismatch: $hash" }
          Expand-Archive amxmodx.zip -DestinationPath amxmodx_win -Force
          $AMXXPC = Get-ChildItem -Recurse -Filter "amxxpc.exe" -Path amxmodx_win | Select-Object -First 1 -ExpandProperty FullName
          if (-not $AMXXPC) { throw "amxxpc.exe not found in the AMX Mod X archive" }
          "AMXXPC=$AMXXPC" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AMXXPC_DIR=$(Split-Path $AMXXPC)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile ${{ env.PLUGIN_NAME }}.sma
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path amxmodx/scripting/compiled -Force | Out-Null
          # EasyHttp includes are vendored in amxmodx/scripting/include.
          & $env:AMXXPC "amxmodx\scripting\$env:PLUGIN_NAME.sma" "-oamxmodx\scripting\compiled\$env:PLUGIN_NAME.amxx" "-iamxmodx\scripting\include" "-iamxmodx_win\addons\amxmodx\scripting\include"
          if (-not (Test-Path "amxmodx/scripting/compiled/$env:PLUGIN_NAME.amxx")) { throw "Compile failed - artifact missing" }

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build_linux, build_windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches plugin version
        run: |
          SOURCE_VERSION=$(sed -n 's/^#define VERSION "\([^"]*\)".*/\1/p' "amxmodx/scripting/${PLUGIN_NAME}.sma")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$SOURCE_VERSION" ]; then
            echo "Could not read VERSION from amxmodx/scripting/${PLUGIN_NAME}.sma" >&2
            exit 1
          fi
          if [ "$SOURCE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin VERSION '${SOURCE_VERSION}'" >&2
            exit 1
          fi

      - name: Download compiled plugin
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.PLUGIN_NAME }}.amxx
          path: dist

      - name: Prepare release files
        run: |
          PLUGIN_FILE=$(find dist -name "${PLUGIN_NAME}.amxx" -print -quit)
          test -n "$PLUGIN_FILE" || { echo "compiled plugin not found" >&2; exit 1; }
          cp "$PLUGIN_FILE" "${PLUGIN_NAME}.amxx"
          sha256sum "${PLUGIN_NAME}.amxx" > SHA256SUMS
          git archive --format=zip --prefix="${PLUGIN_NAME}-${GITHUB_REF_NAME}/" -o "${PLUGIN_NAME}-${GITHUB_REF_NAME}-source.zip" HEAD
          sha256sum "${PLUGIN_NAME}-${GITHUB_REF_NAME}-source.zip" >> SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(
            "${PLUGIN_NAME}.amxx"
            "SHA256SUMS"
            "${PLUGIN_NAME}-${GITHUB_REF_NAME}-source.zip"
          )
          RELEASE_FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
            if [ ${#RELEASE_FLAGS[@]} -gt 0 ]; then
              gh release edit "$GITHUB_REF_NAME" "${RELEASE_FLAGS[@]}"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              "${RELEASE_FLAGS[@]}"
          fi
